services:
  step-ca:
    image: smallstep/step-ca
    ports:
      - "9000:9000"
      # step-ca /metrics is DEFERRED — v0.30.2's documented `metrics:{address}`
      # config block in ca.json doesn't actually open the listener (no log
      # line, no socket inside the container). Until upstream sorts it out,
      # step-ca health is observed via the existing blackbox probe of
      # https://pki.lan:9000/acme/acme/directory in cn-observability.
      # - "9110:9110"
    volumes:
      - step_ca_data:/home/step
    environment:
      - DOCKER_STEPCA_INIT_NAME=${CA_NAME}
      - DOCKER_STEPCA_INIT_DNS_NAMES=${CA_DNS_NAMES}
      - DOCKER_STEPCA_INIT_ADDRESS=:9000
      - DOCKER_STEPCA_INIT_ACME=true
      - DOCKER_STEPCA_INIT_PASSWORD_FILE=/run/secrets/password
    secrets:
      - source: root_ca_crt
        target: root_ca.crt
      - source: root_ca_key
        target: root_ca_key
      - source: ca_password
        target: password
    healthcheck:
      test: ["CMD-SHELL", "curl -sfk https://localhost:9000/health | grep ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      # The CA is upgraded by hand (a bad step-ca image breaks all cert issuance).
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped

  traefik:
    image: traefik:v3.6.9
    depends_on:
      step-ca:
        condition: service_healthy
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--certificatesresolvers.stepca.acme.caserver=https://step-ca:9000/acme/acme/directory"
      - "--certificatesresolvers.stepca.acme.email=${ADMIN_EMAIL}"
      - "--certificatesresolvers.stepca.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.stepca.acme.httpchallenge.entrypoint=web"
      # File provider: routes to services the docker provider can't see
      # (host-networked containers from sibling stacks, e.g. cn-dnsdhcpd's
      # Technitium console). Directory mount, not a single file — single-file
      # binds keep the old inode after git pull and the watch misses edits.
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"
    labels:
      - "traefik.enable=true"
      # Redirect middleware: HTTP → HTTPS (used by other services, not ca-cert)
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
      # Catch-all HTTP→HTTPS redirect (lowest priority, ca-cert overrides it)
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`.+`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=https-redirect"
      - "traefik.http.routers.http-catchall.priority=1"
    environment:
      - LEGO_CA_CERTIFICATES=/certs/root_ca.crt
    ports:
      - "80:80"
      - "443:443"
      # Traefik /metrics — exposed on a dedicated entrypoint so it's not
      # routable via the public HTTP/HTTPS entrypoints. Scraped by kaiser
      # Prometheus job pki-traefik.
      - "8082:8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/acme
      - ./pki/root_ca.crt:/certs/root_ca.crt:ro
      - ./config/traefik:/dynamic:ro
    restart: unless-stopped

  # node-exporter — pki.lan host metrics (CPU/mem/disk/net), scraped by
  # kaiser Prometheus on 10.0.0.250:9100. network_mode: host so /proc, /sys,
  # and the LAN-routable IP are all directly visible.
  node-exporter:
    image: prom/node-exporter:latest
    network_mode: host
    pid: host
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--web.listen-address=:9100"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      # Resilience: reconcile-stack.sh writes resilience_* metrics into this dir.
      - "--collector.textfile.directory=/var/lib/node_exporter/textfile_collector"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node_exporter/textfile_collector:/var/lib/node_exporter/textfile_collector:ro
    restart: unless-stopped

  # promtail — ships docker container logs + systemd journal from pki.lan
  # to kaiser Loki at http://10.1.1.140:3100. Stack="cn-pki", host="pki"
  # labels are applied in config/promtail/promtail.yml.
  promtail:
    image: grafana/promtail:3.4.2
    command: [ "-config.file=/etc/promtail/promtail.yml" ]
    volumes:
      - "./config/promtail/promtail.yml:/etc/promtail/promtail.yml:ro"
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /run/systemd/journal:/run/systemd/journal:ro
      - promtail_positions:/tmp
    restart: unless-stopped

  ca-cert:
    image: busybox:latest
    command: ["httpd", "-f", "-p", "80", "-h", "/www"]
    labels:
      - "traefik.enable=true"
      # HTTP (plain — for bootstrapping trust on new machines)
      - "traefik.http.routers.ca-cert.rule=Host(`${PKI_DOMAIN}`) && Path(`/cert/ca.crt`)"
      - "traefik.http.routers.ca-cert.entrypoints=web"
      - "traefik.http.routers.ca-cert.priority=100"
      # HTTPS — Host() is required so traefik knows the SAN to request from
      # step-ca's ACME endpoint. Without it the certresolver has nothing to
      # order for, traefik serves its self-signed TRAEFIK DEFAULT CERT, and
      # any TLS-verifying probe of https://pki.lan fails. The Uptime Kuma
      # retirement (commit 38b4c3f) removed the last router that carried a
      # Host(pki.lan) signal — this leaves it explicit on the surviving one.
      - "traefik.http.routers.ca-cert-secure.rule=Host(`${PKI_DOMAIN}`) && Path(`/cert/ca.crt`)"
      - "traefik.http.routers.ca-cert-secure.entrypoints=websecure"
      - "traefik.http.routers.ca-cert-secure.tls.certresolver=stepca"
      - "traefik.http.routers.ca-cert-secure.priority=100"
      - "traefik.http.services.ca-cert.loadbalancer.server.port=80"
    volumes:
      - ./pki/root_ca.crt:/www/cert/ca.crt:ro
    restart: unless-stopped

  # Host-wide auto-update. No --label-enable → updates every container on pki
  # except those labeled com.centurylinklabs.watchtower.enable=false (step-ca).
  watchtower:
    image: containrrr/watchtower:latest
    command:
      - "--cleanup"
      - "--schedule=0 0 4 * * *"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.45
    restart: unless-stopped

secrets:
  root_ca_crt:
    file: ./pki/root_ca.crt
  root_ca_key:
    file: ./pki/root_ca.key
  ca_password:
    file: ./pki/password.txt

volumes:
  step_ca_data:
  traefik_acme:
  promtail_positions:
